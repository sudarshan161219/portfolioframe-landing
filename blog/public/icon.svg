        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 72 72"
          width="48px"
          height="48px"
        >
          <defs>
            <filter
              id="tilt-shadow"
              x="-20%"
              y="-20%"
              width="140%"
              height="140%"
            >
              <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="4"
                flood-color="#000000"
                flood-opacity="0.12"
              />
            </filter>
          </defs>

  
          <g transform="translate(36, 33)">
            <rect
